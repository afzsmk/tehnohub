name: Deploy Tehnohub to GitHub Pages

on:
  push:
    branches: ['main'] # или ваша рабочая ветка

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Устанавливаем зависимости, запускаем ТЕСТЫ и собираем
      - name: Test & Build Workforce
        working-directory: ./workforce
        run: |
          npm install
          npm test          # ❗️ ЕСЛИ ТЕСТЫ НЕ ПРОШЛИ — СБОРКА ТУТ ЖЕ ОСТАНОВИТСЯ
          npm run build

      # 2. Формируем сайт для публикации
      - name: Prepare site directory
        run: |
          mkdir -p public_site
          cp -r * public_site/ 2>/dev/null || true
          rm -rf public_site/workforce
          cp -r workforce/dist public_site/workforce

      # 3. Публикация
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
