name: Deploy Tehnohub to GitHub Pages

on:
  push:
    branches: ['main'] # или ваша ветка, например master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Собираем модуль workforce
      - name: Build Workforce
        working-directory: ./workforce
        run: |
          npm install
          npm run build

      # 2. Формируем итоговую папку для публикации (Технохаб + собранный workforce)
      - name: Prepare site directory
        run: |
          mkdir -p public_site
          # Копируем всё содержимое Технохаба (главный index.html и другие инструменты)
          cp -r * public_site/ 2>/dev/null || true
          # Заменяем исходники workforce на его скомпилированную версию
          rm -rf public_site/workforce
          cp -r workforce/dist public_site/workforce

      # 3. Публикуем на GitHub Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
