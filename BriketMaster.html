<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>БРИКЕТМАСТЕР</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg:#0f172a;--panel:#1e293b;--accent:#38bdf8;--accent2:#22d3ee;--text:#f8fafc;--text-dim:#94a3b8;--border:#334155;--success:#4ade80;--danger:#ef4444;--money:#fbbf24;--money2:#f59e0b;--chart-mat:#38bdf8;--chart-fot:#4ade80;--chart-ovh:#fbbf24;--chart-vat:#ef4444; }
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Inter',sans-serif;background-color:var(--bg);color:var(--text);margin:0;padding:75px 18px 16px;height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:13px}
        .modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.65);z-index:200;justify-content:center;align-items:center;backdrop-filter:blur(3px)}
        #universalModal{z-index:1000}
        .modal-content{background:var(--panel);border-radius:16px;padding:22px;max-width:500px;width:90%;border:1px solid var(--border);box-shadow:0 20px 40px rgba(0,0,0,.6)}
        .modal-content h2{margin:0 0 14px;color:var(--accent);font-size:1.2em}
        .modal-content label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;font-weight:600;text-transform:uppercase}
        .modal-content input[type="text"],.modal-content input[type="number"],.modal-content input[type="date"]{width:100%;background:#0f172a;border:1px solid var(--border);color:white;padding:9px 11px;border-radius:8px;margin-bottom:12px;font-family:inherit;font-size:13px}
        .modal-content input:focus{outline:none;border-color:var(--accent)}
        .modal-buttons{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
        .btn{background:var(--accent);color:#0f172a;border:none;font-weight:800;font-size:12px;letter-spacing:.5px;text-transform:uppercase;padding:8px 14px;border-radius:16px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .2s;white-space:nowrap;flex-shrink:0}
        .btn:hover{background:#7dd3fc;transform:translateY(-1px)}
    </style>
</head>
<body>
    <div id="universalModal" class="modal-overlay">
        <div class="modal-content" style="max-width:440px;">
            <h2 id="uModalTitle">Уведомление</h2>
            <div id="uModalMessage" style="font-size:13px;color:var(--text-dim);margin-bottom:16px;line-height:1.5;"></div>
            <div class="modal-buttons" id="uModalButtons"></div>
        </div>
    </div>
    <script>
        window.uiAlert=function(text,title='Уведомление'){
            return new Promise(resolve=>{
                const overlay=document.getElementById('universalModal');
                document.getElementById('uModalTitle').innerText=title;
                document.getElementById('uModalMessage').innerHTML=text;
                const btnContainer=document.getElementById('uModalButtons');
                btnContainer.innerHTML='<button class="btn" id="uModalOkBtn">Ок</button>';
                overlay.style.display='flex';
                document.getElementById('uModalOkBtn').onclick=function(){overlay.style.display='none';resolve()};
            });
        };
        window.uiConfirm=function(text,title='Подтверждение',confirmText='Да, продолжить',cancelText='Отмена'){
            return new Promise(resolve=>{
                const overlay=document.getElementById('universalModal');
                document.getElementById('uModalTitle').innerText=title;
                document.getElementById('uModalMessage').innerHTML=text;
                const btnContainer=document.getElementById('uModalButtons');
                btnContainer.innerHTML=`<button class="btn" id="uModalConfirmBtn">${confirmText}</button><button class="btn" id="uModalCancelBtn" style="background:#475569;">${cancelText}</button>`;
                overlay.style.display='flex';
                document.getElementById('uModalConfirmBtn').onclick=function(){overlay.style.display='none';resolve(true)};
                document.getElementById('uModalCancelBtn').onclick=function(){overlay.style.display='none';resolve(false)};
            });
        };
        // Важно: universalModal нельзя закрывать кликом по фону, иначе await uiAlert/uiConfirm останется невыполненным.
        document.getElementById('universalModal').addEventListener('click',function(e){e.stopPropagation()});
    </script>
</body>
</html>
