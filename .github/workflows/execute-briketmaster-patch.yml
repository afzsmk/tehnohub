name: execute-briketmaster-patch

on:
  push:
    paths:
      - '.github/workflows/execute-briketmaster-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute patch from source workflow and commit result
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys

          yml = Path('.github/workflows/patch-briketmaster.yml').read_text(encoding='utf-8')
          lines = yml.splitlines()
          run_idx = next(i for i, line in enumerate(lines) if line.strip() == 'run: |')
          run_indent = len(lines[run_idx]) - len(lines[run_idx].lstrip())
          code_lines = []
          for line in lines[run_idx + 1:]:
              if line.strip() and (len(line) - len(line.lstrip())) <= run_indent:
                  break
              if line.strip():
                  code_lines.append(line[run_indent + 2:])
              else:
                  code_lines.append('')
          code = '\n'.join(code_lines)
          result = subprocess.run([sys.executable, '-c', code], text=True)
          if result.returncode != 0:
              raise SystemExit(result.returncode)

          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', 'BriketMaster.html'], check=True)
          diff = subprocess.run(['git', 'diff', '--cached', '--quiet'])
          if diff.returncode == 0:
              print('BriketMaster.html already patched; nothing to commit.')
          else:
              subprocess.run(['git', 'commit', '-m', 'fix: update BriketMaster calculation and print logic'], check=True)
              subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
