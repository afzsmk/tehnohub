name: MES Production Migration History Reconcile

on:
  push:
    paths:
      - .github/workflows/mes-production-history-reconcile.yml

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: caeqoipshdtxezcurnkn
  SUPABASE_POOLER_HOST: aws-0-eu-central-1.pooler.supabase.com
  SUPABASE_DB_NAME: postgres
  SUPABASE_DB_PORT: '5432'

jobs:
  reconcile:
    name: Reconcile production MES migration history
    runs-on: ubuntu-latest
    environment:
      name: mes-production
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.117.0

      - name: Reconcile migration history and apply remaining migrations
        working-directory: ./mes
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          db_url="postgresql://postgres.${SUPABASE_PROJECT_REF}:${SUPABASE_DB_PASSWORD}@${SUPABASE_POOLER_HOST}:${SUPABASE_DB_PORT}/${SUPABASE_DB_NAME}?sslmode=require"

          echo 'Remote migration history before reconciliation:'
          history_output="$(supabase migration list --db-url "${db_url}")"
          printf '%s\n' "${history_output}"

          mapfile -t remote_timestamp_versions < <(
            printf '%s\n' "${history_output}" |
              sed -nE 's/.*\| `([0-9]{14})` \|.*/\1/p' |
              sort -u
          )

          if ((${#remote_timestamp_versions[@]} > 0)); then
            echo "Reverting ${#remote_timestamp_versions[@]} legacy timestamped history entries (schema is preserved)."
            for version in "${remote_timestamp_versions[@]}"; do
              echo "Reverting remote history entry ${version}"
              supabase migration repair "${version}" --status reverted --db-url "${db_url}"
            done
          else
            echo 'No legacy timestamped history remains; continuing with repository history reconciliation.'
          fi

          mapfile -t local_versions < <(
            find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' |
              sed -E 's/_.*$//' |
              sort -V
          )

          echo 'Marking repository migrations semantically before 095 as already applied.'
          for version in "${local_versions[@]}"; do
            semantic_version="${version}"
            if [[ "${version}" =~ ^0[0-9]{3}$ ]]; then
              semantic_version="${version:1}"
            elif [[ "${version}" =~ ^0[0-9]{3}[0-9]$ ]]; then
              semantic_version="${version:0:3}"
            fi
            semantic_version=$((10#${semantic_version}))
            if ((semantic_version < 95)); then
              if ! printf '%s\n' "${history_output}" | grep -Eq "\\| \`${version}\` \\|"; then
                echo "Marking local migration ${version} as applied"
                supabase migration repair "${version}" --status applied --db-url "${db_url}"
              fi
            fi
          done

          echo 'Applying repository migrations 095+.'
          supabase db push --db-url "${db_url}"

          echo 'Remote migration history after reconciliation:'
          supabase migration list --db-url "${db_url}"
