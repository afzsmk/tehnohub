name: patch-briketmaster

on:
  push:
    paths:
      - '.github/workflows/patch-briketmaster.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch BriketMaster.html
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('BriketMaster.html')
          s = path.read_text(encoding='utf-8')
          original = s

          # 1) Universal modal must stay above all other overlays.
          marker = '''        .modal-overlay {\n            display: none;'''
          if '#universalModal {' not in s:
              if marker not in s:
                  raise SystemExit('CSS modal marker not found')
              s = s.replace(marker, '''        #universalModal {\n            z-index: 1000;\n        }\n        .modal-overlay {\n            display: none;''', 1)

          # 2) Universal modal backdrop must not close the Promise-based uiAlert/uiConfirm.
          old = "['saveModal', 'historyModal', 'econModal', 'shiftTaskModal', 'calcModal', 'universalModal']"
          new = "['saveModal', 'historyModal', 'econModal', 'shiftTaskModal', 'calcModal']"
          if old in s:
              s = s.replace(old, new, 1)

          # 3) Competitor table: add percentage difference column.
          old = '<tr><th>Показатель</th><th>Наш</th><th>Конкурент</th><th>Разница</th></tr>'
          new = '<tr><th>Показатель</th><th>Наш</th><th>Конкурент</th><th>Разница</th><th>Разница, %</th></tr>'
          if old not in s:
              raise SystemExit('Competitor header marker not found')
          s = s.replace(old, new, 1)

          rows = {
              '<tr><td>Полос, шт</td><td id="cmpStripsOur">0</td><td id="cmpStripsComp">0</td><td id="cmpStripsDiff">0</td></tr>':
              '<tr><td>Полос, шт</td><td id="cmpStripsOur">0</td><td id="cmpStripsComp">0</td><td id="cmpStripsDiff">0</td><td id="cmpStripsPct">0%</td></tr>',
              '<tr><td>Площадь, м²</td><td id="cmpAreaOur">0</td><td id="cmpAreaComp">0</td><td id="cmpAreaDiff">0</td></tr>':
              '<tr><td>Площадь, м²</td><td id="cmpAreaOur">0</td><td id="cmpAreaComp">0</td><td id="cmpAreaDiff">0</td><td id="cmpAreaPct">0%</td></tr>',
              '<tr><td>Цена/полосу, ₽</td><td id="cmpStripPriceOur">0</td><td id="cmpStripPriceComp">0</td><td id="cmpStripPriceDiff">0</td></tr>':
              '<tr><td>Цена/полосу, ₽</td><td id="cmpStripPriceOur">0</td><td id="cmpStripPriceComp">0</td><td id="cmpStripPriceDiff">0</td><td id="cmpStripPricePct">0%</td></tr>',
              '<tr><td>Цена/м², ₽</td><td id="cmpM2PriceOur">0</td><td id="cmpM2PriceComp">0</td><td id="cmpM2PriceDiff">0</td></tr>':
              '<tr><td>Цена/м², ₽</td><td id="cmpM2PriceOur">0</td><td id="cmpM2PriceComp">0</td><td id="cmpM2PriceDiff">0</td><td id="cmpM2PricePct">0%</td></tr>',
          }
          for old, new in rows.items():
              if old not in s:
                  raise SystemExit(f'Competitor row marker not found: {old}')
              s = s.replace(old, new, 1)

          # 4) Replace the economics total/VAT block. VAT is a selling-price tax,
          # not a component of production cost. Keep cost ex-VAT and calculate
          # the VAT amount on the planned selling price separately.
          old = '''                // Итоги\n                const totalNoVAT = totalMaterials + totalProcesses + totalOverhead;\n                const vatRate = parseFloat(document.getElementById('vatVal').value) / 100;\n                const useVAT = document.getElementById('useVAT').checked;\n                const vatAmount = useVAT ? totalNoVAT * vatRate : 0;\n                const totalCost = totalNoVAT + vatAmount;\n                const costPerM2 = areaPerBriquet > 0 ? totalCost / areaPerBriquet : 0;\n                const costPerM2NoVAT = areaPerBriquet > 0 ? totalNoVAT / areaPerBriquet : 0;'''
          new = '''                // Итоги: себестоимость формируется без НДС. НДС начисляется на цену продажи.\n                const totalNoVAT = totalMaterials + totalProcesses + totalOverhead;\n                const vatRate = Math.max(0, parseFloat(document.getElementById('vatVal').value) || 0) / 100;\n                const useVAT = document.getElementById('useVAT').checked;\n                const costPerM2NoVAT = areaPerBriquet > 0 ? totalNoVAT / areaPerBriquet : 0;\n\n                // Плановая отпускная цена: рентабельность считается от себестоимости без НДС.\n                const marginTarget = parseFloat(document.getElementById('margin_target').value) || 0;\n                const marginPriceBriquet = totalNoVAT * (1 + marginTarget / 100);\n                const marginPriceM2 = costPerM2NoVAT * (1 + marginTarget / 100);\n                const sellingVatAmount = marginPriceBriquet * vatRate;\n                const marginPriceBriquetVAT = marginPriceBriquet + sellingVatAmount;\n                const marginPriceM2VAT = marginPriceM2 * (1 + vatRate);\n\n                // Режим НДС влияет только на сравнение с рынком; исходное поле рынка не меняем.\n                const marketPriceBase = parseFloat(document.getElementById('marketPriceInput').value) || 0;\n                const marketPriceComparable = useVAT ? marketPriceBase * (1 + vatRate) : marketPriceBase;\n                const costPerM2Comparable = useVAT ? costPerM2NoVAT : costPerM2NoVAT;'''
          if old not in s:
              raise SystemExit('Economics total block marker not found')
          s = s.replace(old, new, 1)

          # 5) Replace the cost/VAT display block.
          old = '''                document.getElementById('anaVat').innerText = Math.round(vatAmount).toLocaleString() + ' ₽';\n\n                const pctMat = totalCost > 0 ? (totalMaterials / totalCost * 100) : 0;\n                const pctFot = totalCost > 0 ? (totalProcesses / totalCost * 100) : 0;\n                const pctOvh = totalCost > 0 ? (totalOverhead / totalCost * 100) : 0;\n                const pctVat = totalCost > 0 ? (vatAmount / totalCost * 100) : 0;\n                document.getElementById('anaMatPct').innerText = pctMat.toFixed(1) + '%';\n                document.getElementById('anaFotPct').innerText = pctFot.toFixed(1) + '%';\n                document.getElementById('anaOvhPct').innerText = pctOvh.toFixed(1) + '%';\n                document.getElementById('anaVatPct').innerText = pctVat.toFixed(1) + '%';\n\n                document.getElementById('c_mat').style.width = pctMat + '%';\n                document.getElementById('c_fot').style.width = pctFot + '%';\n                document.getElementById('c_ovh').style.width = pctOvh + '%';\n                document.getElementById('c_vat').style.width = pctVat + '%';\n\n                const vatLabel = useVAT ? 'с НДС' : 'без НДС';\n                document.getElementById('finSq').innerText = Math.round(costPerM2).toLocaleString() + ' ₽';\n                document.getElementById('vatLabelSq').innerText = vatLabel;\n                document.getElementById('finTotal').innerText = Math.round(totalCost).toLocaleString() + ' ₽';\n                document.getElementById('vatLabelTotal').innerText = vatLabel;\n\n                // Сравнение с рыночной ценой\n                const mPrice = parseFloat(document.getElementById('marketPriceInput').value) || 0;\n                const diff = mPrice - costPerM2;\n                const perc = costPerM2 > 0 ? Math.round((diff / costPerM2) * 100) : 0;'''
          new = '''                // НДС в блоке затрат показываем отдельно: он относится к цене продажи,\n                // поэтому не входит в себестоимость и не искажает структуру затрат.\n                document.getElementById('anaVat').innerText = Math.round(sellingVatAmount).toLocaleString() + ' ₽';\n\n                const pctBase = totalNoVAT > 0 ? totalNoVAT : 1;\n                const pctMat = totalMaterials / pctBase * 100;\n                const pctFot = totalProcesses / pctBase * 100;\n                const pctOvh = totalOverhead / pctBase * 100;\n                document.getElementById('anaMatPct').innerText = pctMat.toFixed(1) + '%';\n                document.getElementById('anaFotPct').innerText = pctFot.toFixed(1) + '%';\n                document.getElementById('anaOvhPct').innerText = pctOvh.toFixed(1) + '%';\n                document.getElementById('anaVatPct').innerText = (sellingVatAmount > 0 ? (sellingVatAmount / marginPriceBriquet * 100) : 0).toFixed(1) + '%';\n\n                document.getElementById('c_mat').style.width = pctMat + '%';\n                document.getElementById('c_fot').style.width = pctFot + '%';\n                document.getElementById('c_ovh').style.width = pctOvh + '%';\n                document.getElementById('c_vat').style.width = '0%';\n\n                document.getElementById('finSq').innerText = Math.round(costPerM2NoVAT).toLocaleString() + ' ₽';\n                document.getElementById('vatLabelSq').innerText = 'себестоимость без НДС';\n                document.getElementById('finTotal').innerText = Math.round(totalNoVAT).toLocaleString() + ' ₽';\n                document.getElementById('vatLabelTotal').innerText = 'себестоимость без НДС';\n\n                // Сравнение с рыночной ценой в выбранной базе, без изменения исходного поля.\n                const mPrice = marketPriceComparable;\n                const diff = mPrice - costPerM2Comparable;\n                const perc = costPerM2Comparable > 0 ? Math.round((diff / costPerM2Comparable) * 100) : 0;'''
          if old not in s:
              raise SystemExit('Cost/VAT display block marker not found')
          s = s.replace(old, new, 1)

          # 6) Remove duplicate margin declaration and publish one calculation snapshot.
          old = '''                // Отпускная цена по рентабельности\n                const marginTarget = parseFloat(document.getElementById('margin_target').value) || 0;\n                const marginPriceBriquet = totalNoVAT * (1 + marginTarget / 100);\n                const marginPriceM2 = costPerM2NoVAT * (1 + marginTarget / 100);\n                document.getElementById('marginPriceBriquet').innerText = Math.round(marginPriceBriquet).toLocaleString() + ' ₽';\n                document.getElementById('marginPriceM2').innerText = Math.round(marginPriceM2).toLocaleString() + ' ₽';'''
          new = '''                // Отпускная цена по рентабельности (рентабельность на себестоимость без НДС).\n                document.getElementById('marginPriceBriquet').innerText = Math.round(marginPriceBriquet).toLocaleString() + ' ₽';\n                document.getElementById('marginPriceM2').innerText = Math.round(marginPriceM2).toLocaleString() + ' ₽';\n\n                // Один источник расчёта для экранной формы и печатной калькуляции.\n                window.currentCalculation = {\n                    production: {\n                        L, B, cellSize, cellText: document.getElementById('cell').options[document.getElementById('cell').selectedIndex]?.text || String(cellSize),\n                        foilT, margin, defectP, stripW, briquetQty, blankWidth, edgeTrim, sawBlade, usableWidth, bLen,\n                        nPure, thickTheor, strips, areaPerBriquet,\n                        foilMassToBuy, foilMassUseful, scrapTotal, glueClean_kg, solvent_kg, massBriquette\n                    },\n                    costs: {\n                        p_foil, p_scrap, p_glue, p_solv, p_aux,\n                        costFoilGross: foilMassToBuy * p_foil, creditScrap: scrapTotal * p_scrap,\n                        costGlue: glueClean_kg * p_glue, costSolvent: solvent_kg * p_solv, costAux: p_aux,\n                        totalMaterials,\n                        fotNet, fotNdfl, fotInsurance, fotHours, fotCrew, crewHourlyRate,\n                        t_mix, r_mix, t_press, t_mhr_line, r_mhr_line, t_mhr_trim, r_mhr_trim, q_wear, r_wear,\n                        mixCost, pressCost, mhrLineCost, mhrTrimCost, wearCost, totalProcesses,\n                        p_opr, p_ohr, p_tare, oprAmt, ohrAmt, totalOverhead, totalNoVAT, costPerM2NoVAT\n                    },\n                    pricing: {\n                        vatRate, useVAT, sellingVatAmount, marginTarget,\n                        marginPriceBriquet, marginPriceM2, marginPriceBriquetVAT, marginPriceM2VAT,\n                        marketPriceBase, marketPriceComparable, diff, perc\n                    },\n                    competitor: { compWidth, compPrice, compStrips, compArea, compPricePerStrip, compPricePerM2, ourPricePerStrip }\n                };'''
          if old not in s:
              raise SystemExit('Margin block marker not found')
          s = s.replace(old, new, 1)

          # 7) Add percentage difference values to competitor table.
          old = '''                document.getElementById('cmpStripsDiff').innerText = (strips - compStrips);\n                document.getElementById('cmpAreaOur').innerText = areaPerBriquet.toFixed(2);\n                document.getElementById('cmpAreaComp').innerText = compArea.toFixed(2);\n                document.getElementById('cmpAreaDiff').innerText = (areaPerBriquet - compArea).toFixed(2);\n                document.getElementById('cmpStripPriceOur').innerText = Math.round(ourPricePerStrip).toLocaleString();\n                document.getElementById('cmpStripPriceComp').innerText = Math.round(compPricePerStrip).toLocaleString();\n                document.getElementById('cmpStripPriceDiff').innerText = Math.round(ourPricePerStrip - compPricePerStrip).toLocaleString();\n                document.getElementById('cmpM2PriceOur').innerText = Math.round(costPerM2NoVAT).toLocaleString();\n                document.getElementById('cmpM2PriceComp').innerText = Math.round(compPricePerM2).toLocaleString();\n                document.getElementById('cmpM2PriceDiff').innerText = Math.round(costPerM2NoVAT - compPricePerM2).toLocaleString();'''
          new = '''                document.getElementById('cmpStripsDiff').innerText = (strips - compStrips);\n                document.getElementById('cmpStripsPct').innerText = compStrips > 0 ? ((strips - compStrips) / compStrips * 100).toFixed(1) + '%' : '—';\n                document.getElementById('cmpAreaOur').innerText = areaPerBriquet.toFixed(2);\n                document.getElementById('cmpAreaComp').innerText = compArea.toFixed(2);\n                document.getElementById('cmpAreaDiff').innerText = (areaPerBriquet - compArea).toFixed(2);\n                document.getElementById('cmpAreaPct').innerText = compArea > 0 ? ((areaPerBriquet - compArea) / compArea * 100).toFixed(1) + '%' : '—';\n                document.getElementById('cmpStripPriceOur').innerText = Math.round(ourPricePerStrip).toLocaleString();\n                document.getElementById('cmpStripPriceComp').innerText = Math.round(compPricePerStrip).toLocaleString();\n                document.getElementById('cmpStripPriceDiff').innerText = Math.round(ourPricePerStrip - compPricePerStrip).toLocaleString();\n                document.getElementById('cmpStripPricePct').innerText = compPricePerStrip > 0 ? ((ourPricePerStrip - compPricePerStrip) / compPricePerStrip * 100).toFixed(1) + '%' : '—';\n                document.getElementById('cmpM2PriceOur').innerText = Math.round(costPerM2NoVAT).toLocaleString();\n                document.getElementById('cmpM2PriceComp').innerText = Math.round(compPricePerM2).toLocaleString();\n                document.getElementById('cmpM2PriceDiff').innerText = Math.round(costPerM2NoVAT - compPricePerM2).toLocaleString();\n                document.getElementById('cmpM2PricePct').innerText = compPricePerM2 > 0 ? ((costPerM2NoVAT - compPricePerM2) / compPricePerM2 * 100).toFixed(1) + '%' : '—';'''
          if old not in s:
              raise SystemExit('Competitor calculation block marker not found')
          s = s.replace(old, new, 1)

          # 8) Toggle VAT without mutating/rounding the market price input.
          old = '''                document.getElementById('useVAT').addEventListener('change', function() {\n                    const vat = parseFloat(document.getElementById('vatVal').value) / 100;\n                    let mPrice = parseFloat(document.getElementById('marketPriceInput').value) || 0;\n                    if (this.checked) mPrice = mPrice * (1 + vat);\n                    else mPrice = mPrice / (1 + vat);\n                    document.getElementById('marketPriceInput').value = Math.round(mPrice);\n                    calculate();\n                    saveState();\n                });'''
          new = '''                document.getElementById('useVAT').addEventListener('change', function() {\n                    calculate();\n                    saveState();\n                });'''
          if old not in s:
              raise SystemExit('VAT toggle marker not found')
          s = s.replace(old, new, 1)

          # 9) Replace printCalcPDF with snapshot consumer; no duplicated business calculations.
          start = s.find('            // Печать калькуляции (Клей термореактивный, 2 колонки, 1 лист А4)')
          end = s.find('            window.onload = function() {', start)
          if start < 0 or end < 0:
              raise SystemExit('printCalcPDF function boundaries not found')

          replacement = '''            // Печать калькуляции: использует последний снимок window.currentCalculation.\n            window.printCalcPDF = function() {\n                const calc = window.currentCalculation;\n                if (!calc) {\n                    calculate();\n                }\n                const c = window.currentCalculation;\n                const p = c.production;\n                const k = c.costs;\n                const pr = c.pricing;\n                const cp = c.competitor;\n\n                const company = document.getElementById('calcCompany').value || 'ООО «ЗСМК»';\n                const author = document.getElementById('calcAuthor').value || '__________________';\n                const reviewer = document.getElementById('calcReviewer').value || '__________________';\n                const approver = document.getElementById('calcApprover').value || '__________________';\n                const currentDate = new Date().toLocaleDateString('ru-RU');\n                const briquetQty = p.briquetQty || 1;\n\n                const mPriceLabel = pr.useVAT ? `${pr.marketPriceBase} ₽/м² + НДС` : `${pr.marketPriceBase} ₽/м² без НДС`;\n                const marketDiffText = pr.diff >= 0\n                    ? `Выгоднее на ${Math.round(pr.diff).toLocaleString()} ₽ (${pr.perc}%)`\n                    : `Дороже на ${Math.round(Math.abs(pr.diff)).toLocaleString()} ₽ (${Math.abs(pr.perc)}%)`;\n\n                const w = window.open('', '_blank', 'width=880,height=820');\n                if (!w) {\n                    uiAlert('Браузер заблокировал окно печати. Разрешите всплывающие окна для этого приложения.', 'Печать');\n                    return;\n                }\n                w.document.write(`<html><head><title>Плановая калькуляция себестоимости</title><style>\n                    @page { size: A4 portrait; margin: 10mm 12mm; }\n                    body { font-family: 'Inter','Arial',sans-serif; padding:0; margin:0; color:#111; font-size: 11px; line-height:1.25; }\n                    .sheet { page-break-inside: avoid; }\n                    .header { text-align:center; margin-bottom:12px; }\n                    .company { font-weight:800; font-size:15px; text-transform:uppercase; margin-bottom:3px; }\n                    .doc-title { font-size:15px; font-weight:800; text-transform:uppercase; margin:3px 0; }\n                    .sub-line { font-size:11px; color:#555; }\n                    .two-col { display:flex; gap:14px; }\n                    .col-half { flex:1; }\n                    table { width:100%; border-collapse:collapse; margin-bottom:8px; }\n                    th, td { border:1px solid #aaa; padding:4px 6px; text-align:left; font-size:11px; }\n                    th { background:#f0f0f0; font-weight:700; }\n                    .right { text-align:right; }\n                    .sec-hdr { font-weight:800; font-size:11.5px; text-transform:uppercase; background:#e5e7eb; padding:4px 6px; border:1px solid #aaa; margin-top:6px; margin-bottom:3px; }\n                    .total-row { font-weight:800; background:#f3f4f6; }\n                    .price-box { border:1.5px solid #111; padding:7px; margin-top:6px; background:#fafafa; }\n                    .signatures { display:flex; justify-content:space-between; margin-top:16px; gap:16px; }\n                    .sign-box { flex:1; text-align:center; font-size:11px; }\n                    .sign-line { border-bottom:1px solid #111; margin:16px auto 3px; width:90%; }\n                </style></head><body><div class="sheet">\n                    <div class="header">\n                        <div class="company">${company}</div>\n                        <div class="doc-title">Плановая калькуляция себестоимости</div>\n                        <div class="sub-line">на изготовление сотового заполнителя (брикета) — ${briquetQty} шт. (${(p.areaPerBriquet * briquetQty).toFixed(1)} м²)</div>\n                        <div class="sub-line">Дата составления: ${currentDate} | Формат панели: ${p.L} × ${p.B} мм, ячейка ${p.cellText}</div>\n                    </div>\n\n                    <div class="two-col">\n                        <div class="col-half">\n                            <div class="sec-hdr">1. Сырьё и материалы</div>\n                            <table>\n                                <tr><th>Статья затрат</th><th class="right">Расход</th><th class="right">Цена</th><th class="right">Сумма, ₽</th></tr>\n                                <tr><td>Фольга алюминиевая</td><td class="right">${p.foilMassToBuy.toFixed(2)} кг</td><td class="right">${k.p_foil}</td><td class="right">${Math.round(k.costFoilGross).toLocaleString()}</td></tr>\n                                <tr><td>Возвратный лом (кредит)</td><td class="right">-${p.scrapTotal.toFixed(2)} кг</td><td class="right">${k.p_scrap}</td><td class="right">-${Math.round(k.creditScrap).toLocaleString()}</td></tr>\n                                <tr><td>Клей термореактивный</td><td class="right">${p.glueClean_kg.toFixed(2)} кг</td><td class="right">${k.p_glue}</td><td class="right">${Math.round(k.costGlue).toLocaleString()}</td></tr>\n                                <tr><td>Этилацетат (растворитель)</td><td class="right">${p.solvent_kg.toFixed(2)} кг</td><td class="right">${k.p_solv}</td><td class="right">${Math.round(k.costSolvent).toLocaleString()}</td></tr>\n                                <tr><td>Разделительные материалы</td><td class="right">1 компл.</td><td class="right">${k.p_aux}</td><td class="right">${Math.round(k.costAux).toLocaleString()}</td></tr>\n                                <tr class="total-row"><td><strong>Итого материалы:</strong></td><td colspan="3" class="right"><strong>${Math.round(k.totalMaterials).toLocaleString()} ₽</strong></td></tr>\n                            </table>\n\n                            <div class="sec-hdr">2. Технологические переделы (ФОТ и линии)</div>\n                            <table>\n                                <tr><th>Статья затрат</th><th class="right">Норма</th><th class="right">Тариф</th><th class="right">Сумма, ₽</th></tr>\n                                <tr><td>Замес клея</td><td class="right">${k.t_mix} ч</td><td class="right">${k.r_mix} ₽/ч</td><td class="right">${Math.round(k.mixCost).toLocaleString()}</td></tr>\n                                <tr><td>Сборка и прессование (звено)</td><td class="right">${k.t_press} ч</td><td class="right">${Math.round(k.crewHourlyRate)} ₽/ч</td><td class="right">${Math.round(k.pressCost).toLocaleString()}</td></tr>\n                                <tr><td>MHR линии нанесения</td><td class="right">${k.t_mhr_line} ч</td><td class="right">${k.r_mhr_line} ₽/ч</td><td class="right">${Math.round(k.mhrLineCost).toLocaleString()}</td></tr>\n                                <tr><td>MHR станка торцовки</td><td class="right">${k.t_mhr_trim} ч</td><td class="right">${k.r_mhr_trim} ₽/ч</td><td class="right">${Math.round(k.mhrTrimCost).toLocaleString()}</td></tr>\n                                <tr><td>Износ инструмента</td><td class="right">${k.q_wear} шт</td><td class="right">${k.r_wear} ₽</td><td class="right">${Math.round(k.wearCost).toLocaleString()}</td></tr>\n                                <tr class="total-row"><td><strong>Итого переделы:</strong></td><td colspan="3" class="right"><strong>${Math.round(k.totalProcesses).toLocaleString()} ₽</strong></td></tr>\n                            </table>\n                        </div>\n\n                        <div class="col-half">\n                            <div class="sec-hdr">3. Накладные расходы</div>\n                            <table>\n                                <tr><th>Статья расходов</th><th class="right">База / %</th><th class="right">Сумма, ₽</th></tr>\n                                <tr><td>ОПР (общепроизводственные)</td><td class="right">${k.p_opr}%</td><td class="right">${Math.round(k.oprAmt).toLocaleString()}</td></tr>\n                                <tr><td>ОХР (о