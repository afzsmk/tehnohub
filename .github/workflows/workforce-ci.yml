name: Workforce CI

on:
  pull_request:
    paths:
      - 'workforce/**'
      - '.github/workflows/workforce-ci.yml'
  push:
    branches:
      - 'feature/mes-integration-hardening'
    paths:
      - 'workforce/**'
      - '.github/workflows/workforce-ci.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workforce
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: workforce/package.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
