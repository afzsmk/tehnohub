name: apply-mes-route-bootstrap-fix
on:
  push:
    paths:
      - '.github/workflows/mes-route-bootstrap-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch MES startup and route save
        shell: python
        run: |
          from pathlib import Path
          import re

          main = Path('mes/src/main.ts')
          s = main.read_text(encoding='utf-8')
          old = """if (supabase) { authUnsubscribe = subscribeMesAuth(supabase, async () => { try { authState = await getMesAuthState(supabase); if (authState.identity) { startRealtime(); await hydrateRemoteState(); } else { stopRealtime(); remoteCalendarRevision = undefined; render(); } } catch (error) { showError(error); } }); void getMesAuthState(supabase).then(async result => { authState = result; if (authState.identity) { startRealtime(); await hydrateRemoteState(); } else render(); }).catch(showError); } else render();"""
          new = """function renderRemoteLoading(): void { root.innerHTML = `<div class=\"panel\" style=\"max-width:900px;margin:40px auto;padding:28px\"><div class=\"subtle\">TEHNOHUB · MES</div><h2 style=\"margin-bottom:8px\">Подключение к MES</h2><div class=\"subtle\">Загрузка текущего состояния производства…</div></div>`; bindAuthControls(); }\nif (supabase) {\n  authUnsubscribe = subscribeMesAuth(supabase, async () => {\n    try {\n      authState = await getMesAuthState(supabase, { hydrateSnapshot: false });\n      if (authState.identity) {\n        startRealtime();\n        render();\n        try { await hydrateRemoteState(); } catch (error) { showError(error); }\n      } else {\n        stopRealtime();\n        remoteCalendarRevision = undefined;\n        render();\n      }\n    } catch (error) { showError(error); }\n  });\n  void getMesAuthState(supabase, { hydrateSnapshot: false }).then(async result => {\n    authState = result;\n    if (authState.identity) {\n      renderRemoteLoading();\n      startRealtime();\n      try { await hydrateRemoteState(); } catch (error) { showError(error); }\n    } else render();\n  }).catch(error => { showError(error); render(); });\n} else render();"""
          if old not in s:
              raise SystemExit('main.ts startup block not found')
          main.write_text(s.replace(old, new), encoding='utf-8')

          nsi = Path('mes/src/ui/nsiAdminPage.ts')
          s = nsi.read_text(encoding='utf-8')
          old = """  form.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(form);const av=Boolean(f.get('active'));const id=editingId??createId();\n    try{\n      if(formKind==='operations')await rpc.saveOperation({id,code:String(f.get('code')||''),name:String(f.get('name')||''),description:String(f.get('description')||''),active:av});\n      if(formKind==='products')await rpc.saveProduct({id,code:String(f.get('code')||''),name:String(f.get('name')||''),unit:String(f.get('unit')||'')});\n      if(formKind==='professions')await rpc.saveProfession({id,code:String(f.get('code')||''),name:String(f.get('name')||''),description:String(f.get('description')||''),active:av});\n      if(formKind==='qualifications')await rpc.saveQualification({id,code:String(f.get('code')||''),name:String(f.get('name')||''),level:Number(f.get('level')),description:String(f.get('description')||''),active:av});\n      if(formKind==='brigades')await rpc.saveBrigade({id,code:String(f.get('code')||''),name:String(f.get('name')||''),description:String(f.get('description')||''),active:av});\n      if(formKind==='workCenters')await rpc.saveWorkCenter({id,code:String(f.get('code')||''),name:String(f.get('name')||''),site_code:String(f.get('site_code')||''),description:String(f.get('description')||''),active:av});\n      if(formKind==='employees')await rpc.saveEmployee({id,personnel_no:String(f.get('personnel_no')||''),name:String(f.get('name')||''),profession:'',profession_id:String(f.get('profession_id')||'')||null,qualification_id:String(f.get('qualification_id')||'')||null,brigade_id:String(f.get('brigade_id')||'')||null,qualification_level:0,active:av});\n      if(formKind==='equipment')await rpc.saveEquipmentNormalized({id,code:String(f.get('code')||''),name:String(f.get('name')||''),work_center:String(f.get('work_center_id')||''),work_center_id:String(f.get('work_center_id')||''),capabilities:Array.from(f.getAll('equipment_capability_code')).map(String),active:av});\n      if(formKind==='routes')await rpc.saveRoute({id,product_id:String(f.get('product_id')||''),code:String(f.get('code')||''),name:String(f.get('name')||''),version:Number(f.get('version')),valid_from:String(f.get('valid_from')||'')||null,valid_to:String(f.get('valid_to')||'')||null,description:String(f.get('description')||''),active:av});\n      if(formKind==='routeOperations'){const r=data.routes.find(x=>x.id===String(f.get('route_id')));if(!r)throw new Error('Маршрут не найден');const op=data.operations.find(x=>x.id===String(f.get('operation_id')));if(!op)throw new Error('Операция не найдена');await rpc.saveRouteOperation({id,route_id:r.id,product_id:r.product_id,sequence:Number(f.get('sequence')),operation_id:op.id,code:op.code,name:op.name,work_center:String(f.get('work_center_id')||''),work_center_id:String(f.get('work_center_id')||''),required_qualification_id:String(f.get('required_qualification_id')||'')||null,required_equipment_ids:Array.from(f.getAll('required_equipment_id')).map(String),setup_minutes:0,run_minutes_per_unit:0,setup_norm_hours:parseDecimal(f.get('setup_norm_hours')),labor_norm_hours_per_unit:parseDecimal(f.get('labor_norm_hours_per_unit')),workers_required:Number(f.get('workers_required')),active:av});}\n      if(formKind==='shifts')await rpc.saveShift({id:String(f.get('id')||id),name:String(f.get('name')||''),start_minute:timeToMins(String(f.get('start_time')||'00:00')),duration_minutes:Number(f.get('duration_minutes')),active:av});\n      if(formKind==='downtimeReasons')await rpc.saveDowntimeReason({code:String(f.get('code')||''),name:String(f.get('name')||''),category:String(f.get('category')||'OTHER'),is_planned:Boolean(f.get('is_planned')),description:String(f.get('description')||''),active:av});\n      if(formKind==='scrapReasons')await rpc.saveScrapReason({code:String(f.get('code')||''),name:String(f.get('name')||''),category:String(f.get('category')||'OTHER'),description:String(f.get('description')||''),active:av});\n      close();await refresh();\n    }catch(error){alert(error instanceof Error?error.message:'Не удалось сохранить запись');}\n  });"""
          new = """  form.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(form);const av=Boolean(f.get('active'));const id=editingId??createId();\n    const errorMessage=(error:unknown)=>{const x=error as {message?:unknown;details?:unknown;hint?:unknown;code?:unknown};const message=typeof x?.message==='string'?x.message:(error instanceof Error?error.message:String(error));const extra=[typeof x?.details==='string'?x.details:'',typeof x?.hint==='string'?x.hint:'',typeof x?.code==='string'?`код ${x.code}`:''].filter(Boolean);return [message,...extra].join(' — ');};\n    try{\n      if(formKind==='operations')await rpc.saveOperation({id,code:String(f.get('code')||''),name:String(f.get('name')||''),description:String(f.get('description')||''),active:av});\n      if(formKind==='products')await rpc.saveProduct({id,code:String(f.get('code')||''),name:String(f.get('name')||''),unit:String(f.get('unit')||'')});\n      if(formKind==='professions')await rpc.saveProfession({id,code:String(f.get('code')||''),name:String(f.get('name')||''),description:String(f.get('description')||''),active:av});\n      if(formKind==='qualifications')await rpc.saveQualification({id,code:String(f.get('code')||''),name:String(f.get('name')||''),level:Number(f.get('level')),description:String(f.get('description')||''),active:av});\n      if(formKind==='brigades')await rpc.saveBrigade({id,code:String(f.get('code')||''),name:String(f.get('name')||''),description:String(f.get('description')||''),active:av});\n      if(formKind==='workCenters')await rpc.saveWorkCenter({id,code:String(f.get('code')||''),name:String(f.get('name')||''),site_code:String(f.get('site_code')||''),description:String(f.get('description')||''),active:av});\n      if(formKind==='employees')await rpc.saveEmployee({id,personnel_no:String(f.get('personnel_no')||''),name:String(f.get('name')||''),profession:'',profession_id:String(f.get('profession_id')||'')||null,qualification_id:String(f.get('qualification_id')||'')||null,brigade_id:String(f.get('brigade_id')||'')||null,qualification_level:0,active:av});\n      if(formKind==='equipment')await rpc.saveEquipmentNormalized({id,code:String(f.get('code')||''),name:String(f.get('name')||''),work_center:String(f.get('work_center_id')||''),work_center_id:String(f.get('work_center_id')||''),capabilities:Array.from(f.getAll('equipment_capability_code')).map(String),active:av});\n      if(formKind==='routes'){const productId=String(f.get('product_id')||'').trim(),code=String(f.get('code')||'').trim(),name=String(f.get('name')||'').trim(),version=Number(f.get('version')),validFrom=String(f.get('valid_from')||'')||null,validTo=String(f.get('valid_to')||'')||null;if(!productId||!code||!name)throw new Error('Для маршрута обязательны продукт, код и название');if(!Number.isInteger(version)||version<=0)throw new Error('Версия маршрута должна быть целым числом больше 0');if(validFrom&&validTo&&validTo<validFrom)throw new Error('Дата «Действует по» не может быть раньше «Действует с»');const duplicate=data.routes.find(x=>x.product_id===productId&&x.code===code&&x.version===version&&x.id!==editingId);if(duplicate)throw new Error(`Маршрут с кодом ${code} и версией ${version} для выбранного продукта уже существует`);await rpc.saveRoute({id,product_id:productId,code,name,version,valid_from:validFrom,valid_to:validTo,description:String(f.get('description')||''),active:av});}\n      if(formKind==='routeOperations'){const r=data.routes.find(x=>x.id===String(f.get('route_id')));if(!r)throw new Error('Маршрут не найден');const op=data.operations.find(x=>x.id===String(f.get('operation_id')));if(!op)throw new Error('Операция не найдена');await rpc.saveRouteOperation({id,route_id:r.id,product_id:r.product_id,sequence:Number(f.get('sequence')),operation_id:op.id,code:op.code,name:op.name,work_center:String(f.get('work_center_id')||''),work_center_id:String(f.get('work_center_id')||''),required_qualification_id:String(f.get('required_qualification_id')||'')||null,required_equipment_ids:Array.from(f.getAll('required_equipment_id')).map(String),setup_minutes:0,run_minutes_per_unit:0,setup_norm_hours:parseDecimal(f.get('setup_norm_hours')),labor_norm_hours_per_unit:parseDecimal(f.get('labor_norm_hours_per_unit')),workers_required:Number(f.get('workers_required')),active:av});}\n      if(formKind==='shifts')await rpc.saveShift({id:String(f.get('id')||id),name:String(f.get('name')||''),start_minute:timeToMins(String(f.get('start_time')||'00:00')),duration_minutes:Number(f.get('duration_minutes')),active:av});\n      if(formKind==='downtimeReasons')await rpc.saveDowntimeReason({code:String(f.get('code')||''),name:String(f.get('name')||''),category:String(f.get('category')||'OTHER'),is_planned:Boolean(f.get('is_planned')),description:String(f.get('description')||''),active:av});\n      if(formKind==='scrapReasons')await rpc.saveScrapReason({code:String(f.get('code')||''),name:String(f.get('name')||''),category:String(f.get('category')||'OTHER'),description:String(f.get('description')||''),active:av});\n      close();\n    }catch(error){alert(`Ошибка сохранения: ${errorMessage(error)}`);return;}\n    try{await refresh();}catch(error){alert(`Запись сохранена, но список не обновился: ${errorMessage(error)}`);}\n  });"""
          if old not in s:
              raise SystemExit('nsiAdminPage submit block not found')
          nsi.write_text(s.replace(old, new), encoding='utf-8')

      - name: Verify changes
        run: |
          grep -F "hydrateSnapshot: false" mes/src/main.ts
          grep -F "Запись сохранена, но список не обновился" mes/src/ui/nsiAdminPage.ts
      - name: Commit fixes and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/mes-route-bootstrap-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mes/src/main.ts mes/src/ui/nsiAdminPage.ts .github/workflows/mes-route-bootstrap-fix.yml
          git commit -m 'fix(mes): harden route save and startup hydration'
          git push