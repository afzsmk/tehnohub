name: One-off MES NSI patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'add one-off NSI patch workflow')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Apply NSI patch
        run: python3 tools/one_off_nsi_patch.py
      - name: Remove one-off tooling
        run: rm -f tools/one_off_nsi_patch.py .github/workflows/one_off_nsi_patch.yml
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mes/src/ui/nsiAdminPage.ts mes/src/integration/mesMasterDataRpc.ts tools/one_off_nsi_patch.py .github/workflows/one_off_nsi_patch.yml
          git status --short
          git commit -m 'fix(mes): normalize equipment capabilities and sort nsi views'
          git push origin HEAD:main
