name: Workforce Supabase Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'workforce/supabase/functions/mes-publish/**'
      - 'workforce/supabase/config.toml'
      - '.github/workflows/workforce-supabase-functions.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: cihzyokqrjpmzoiezmwc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.117.0

      - name: Deploy mes-publish
        working-directory: ./workforce
        run: |
          set -euo pipefail
          supabase functions deploy mes-publish --project-ref "${SUPABASE_PROJECT_REF}"

      - name: Verify deployed function
        working-directory: ./workforce
        run: |
          set -euo pipefail
          functions=$(supabase functions list --project-ref "${SUPABASE_PROJECT_REF}")
          echo "${functions}"
          echo "${functions}" | grep -E 'mes-publish|ACTIVE' >/dev/null
