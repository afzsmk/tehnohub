name: One-off MES equipment UI refactor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-mes-equipment-ui-refactor.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify runner
        run: |
          echo "workflow runner is active"
          test -f mes/src/ui/nsiAdminPage.ts
