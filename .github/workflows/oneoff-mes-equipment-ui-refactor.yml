name: One-off MES equipment UI refactor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-mes-equipment-ui-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Refactor equipment UI
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('mes/src/ui/nsiAdminPage.ts')
          text = path.read_text(encoding='utf-8')

          replacements = [
            (
              """  const capabilityLabel=(code:string)=>{const op=data.routeOperations.find(r=>r.code===code);return op?`${op.code} — ${op.name}`:code};\n  const equipmentCapabilitiesSelected=(equipmentId:string,fallback:string[])=>{const normalized=data.equipmentCapabilities.filter(c=>c.equipment_id===equipmentId).map(c=>c.operation_code);return normalized.length?normalized:fallback};\n  const capabilityOptions=()=>{const seen=new Map<string,string>();for(const op of data.routeOperations.filter(r=>r.active).slice().sort((a,b)=>a.code.localeCompare(b.code,'ru'))){if(!seen.has(op.code))seen.set(op.code,`${op.code} — ${op.name}`);}return Array.from(seen.entries());};\n  const equipmentCapabilityPicker=(selected:string[])=>{const opts=capabilityOptions();if(!opts.length)return `<div class=\"nsi-equipment-picker\" data-capability-picker=\"1\"><div class=\"nsi-equipment-picker-empty\">Сначала создайте операции маршрутов — они будут доступны как технологические возможности оборудования.</div></div>`;return `<div class=\"nsi-equipment-picker\" data-capability-picker=\"1\">${opts.map(([code,label])=>`<label class=\"nsi-equipment-option\"><input type=\"checkbox\" name=\"equipment_capability_code\" value=\"${esc(code)}\" ${selected.includes(code)?'checked':''}><span>${esc(label)}</span></label>`).join('')}</div>`;};\n""",
              "",
            ),
            (
              """    if(kind==='equipment'){const x=existing as any;open(kind,`${title} оборудование`,field('code','Код','text',x?.code??'')+field('name','Название','text',x?.name??'')+select('work_center_id','Рабочий центр',data.workCenters.filter(w=>w.active).map(w=>[w.id,`${w.code} — ${w.name}`]),x?.work_center_id??'',true)+`<div class=\"nsi-admin-field full\"><label>Технологические возможности</label>${equipmentCapabilityPicker(equipmentCapabilitiesSelected(x?.id??'',x?.capabilities??[]))}<small style=\"color:var(--muted,#667085)\">Отметьте операции маршрутов, которые это оборудование может выполнять.</small></div>`+check('active','Активно',x?.active!==false),x?.id);}\n""",
              """    if(kind==='equipment'){const x=existing as any;open(kind,`${title} оборудование`,field('code','Код','text',x?.code??'')+field('name','Название','text',x?.name??'')+select('work_center_id','Рабочий центр',data.workCenters.filter(w=>w.active).map(w=>[w.id,`${w.code} — ${w.name}`]),x?.work_center_id??'',true)+`<div class=\"nsi-admin-field full\"><small style=\"color:var(--muted,#667085)\">Конкретное оборудование для производственной операции указывается в карточке операции маршрута.</small></div>`+check('active','Активно',x?.active!==false),x?.id);}\n""",
            ),
            (
              """    return `<div class=\"nsi-equipment-picker\" data-equipment-picker=\"1\">${equipment.map(e=>`<label class=\"nsi-equipment-option\"><input type=\"checkbox\" name=\"required_equipment_id\" value=\"${esc(e.id)}\" ${selected.includes(e.id)?'checked':''}><span><b>${esc(e.code)}</b> — ${esc(e.name)}<small>${esc(e.capabilities.join(', ')||'Возможности не заполнены')}</small></span></label>`).join('')}</div>`;\n""",
              """    return `<div class=\"nsi-equipment-picker\" data-equipment-picker=\"1\">${equipment.map(e=>`<label class=\"nsi-equipment-option\"><input type=\"checkbox\" name=\"required_equipment_id\" value=\"${esc(e.id)}\" ${selected.includes(e.id)?'checked':''}><span><b>${esc(e.code)}</b> — ${esc(e.name)}</span></label>`).join('')}</div>`;\n""",
            ),
            (
              """      if(formKind==='equipment')await rpc.saveEquipmentNormalized({id,code:String(f.get('code')||''),name:String(f.get('name')||''),work_center:String(f.get('work_center_id')||''),work_center_id:String(f.get('work_center_id')||''),capabilities:Array.from(f.getAll('equipment_capability_code')).map(String),active:av});\n""",
              """      if(formKind==='equipment')await rpc.saveEquipmentNormalized({id,code:String(f.get('code')||''),name:String(f.get('name')||''),work_center:String(f.get('work_center_id')||''),work_center_id:String(f.get('work_center_id')||''),capabilities:data.equipment.find(e=>e.id===id)?.capabilities??[],active:av});\n""",
            ),
            (
              """<label>Оборудование</label>${equipmentPicker(wcId,equipmentIds)}<small style=\"color:var(--muted,#667085)\">Выберите конкретные единицы, которые допустимы для этой операции. Можно выбрать несколько.</small>""",
              """<label>Оборудование для операции</label>${equipmentPicker(wcId,equipmentIds)}<small style=\"color:var(--muted,#667085)\">Выберите конкретные единицы оборудования, которые должны быть назначены этой операции. Можно выбрать несколько.</small>""",
            ),
            (
              """    if(tab==='equipment'){headers='<th>Код</th><th>Оборудование</th><th>Рабочий центр</th><th>Возможности</th><th>Статус</th><th>Действия</th>';rows=data.equipment.map(x=>`<tr><td><b>${esc(x.code)}</b></td><td>${esc(x.name)}</td><td>${esc(data.workCenters.find(w=>w.id===x.work_center_id)?.name??x.work_center)}</td><td>${esc((data.equipmentCapabilities.filter(c=>c.equipment_id===x.id).map(c=>capabilityLabel(c.operation_code)).join(', '))||x.capabilities.join(', ')||'—')}</td><td>${status(x.active)}</td>${action('equipment',x.id)}</tr>`).join('');}\n""",
              """    if(tab==='equipment'){headers='<th>Код</th><th>Оборудование</th><th>Рабочий центр</th><th>Статус</th><th>Действия</th>';rows=data.equipment.map(x=>`<tr><td><b>${esc(x.code)}</b></td><td>${esc(x.name)}</td><td>${esc(data.workCenters.find(w=>w.id===x.work_center_id)?.name??x.work_center)}</td><td>${status(x.active)}</td>${action('equipment',x.id)}</tr>`).join('');}\n""",
            ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'replacement count={count}: {old[:80]!r}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify changed source
        run: |
          test "$(grep -o "equipment_capability_code" mes/src/ui/nsiAdminPage.ts | wc -l)" -eq 0
          test "$(grep -o "Технологические возможности" mes/src/ui/nsiAdminPage.ts | wc -l)" -eq 0
          grep -q "Оборудование для операции" mes/src/ui/nsiAdminPage.ts
          grep -q "capabilities:data.equipment.find" mes/src/ui/nsiAdminPage.ts
          ! grep -q "<th>Возможности</th>" mes/src/ui/nsiAdminPage.ts
          git diff --check

      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mes/src/ui/nsiAdminPage.ts
          git diff --cached --check
          git diff --cached -- mes/src/ui/nsiAdminPage.ts
          git commit -m 'chore(mes): remove duplicate equipment operation editor'
          git push
