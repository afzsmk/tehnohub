name: One-off MES equipment UI refactor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-mes-equipment-ui-refactor.yml'
      - 'mes/tools/refactor_equipment_ui.py'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Apply refactor
        run: python mes/tools/refactor_equipment_ui.py
      - name: Verify source
        run: |
          test "$(grep -o "equipment_capability_code" mes/src/ui/nsiAdminPage.ts | wc -l)" -eq 0
          test "$(grep -o "Технологические возможности" mes/src/ui/nsiAdminPage.ts | wc -l)" -eq 0
          grep -q "Оборудование для операции" mes/src/ui/nsiAdminPage.ts
          grep -q "capabilities:data.equipment.find" mes/src/ui/nsiAdminPage.ts
          ! grep -q "<th>Возможности</th>" mes/src/ui/nsiAdminPage.ts
          git diff --check
      - name: Commit source and remove helper files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mes/src/ui/nsiAdminPage.ts
          git rm .github/workflows/oneoff-mes-equipment-ui-refactor.yml mes/tools/refactor_equipment_ui.py
          git diff --cached --check
          git commit -m 'chore(mes): remove duplicate equipment operation editor'
          git push
