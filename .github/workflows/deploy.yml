name: Deploy Tehnohub to GitHub Pages

on:
  push:
    branches: ['main']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MES_SUPABASE_URL: https://caeqoipshdtxezcurnkn.supabase.co
  MES_SUPABASE_PUBLISHABLE_KEY: sb_publishable_-WF6AF_CkK4BWX8mUERwLg_2GsfX703

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # 0. Жесткий schema/release gate: deployment не может пройти,
      # пока текущий набор MES-migration не проходит reset, pgTAP и lint.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.105.0

      - name: Start local Supabase
        working-directory: ./mes
        run: supabase start

      - name: Reset local database from migrations
        working-directory: ./mes
        run: supabase db reset --local --no-seed

      - name: Run database security regression tests
        working-directory: ./mes
        run: supabase test db --local

      - name: Lint database schema
        working-directory: ./mes
        run: supabase db lint --local --level error

      - name: Stop local Supabase
        if: always()
        working-directory: ./mes
        run: supabase stop

      # 0.5. Production API smoke-check: verify the production Supabase endpoint
      # is reachable and that an unauthenticated caller cannot execute MES RPC.
      - name: Smoke-check production Supabase API
        shell: bash
        run: |
          set -euo pipefail

          health_code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "apikey: ${MES_SUPABASE_PUBLISHABLE_KEY}" \
            "${MES_SUPABASE_URL}/rest/v1/")

          test "${health_code}" = "200"

          rpc_code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -X POST \
            -H "apikey: ${MES_SUPABASE_PUBLISHABLE_KEY}" \
            -H "Content-Type: application/json" \
            --data '{}' \
            "${MES_SUPABASE_URL}/rest/v1/rpc/mes_get_runtime_snapshot")

          case "${rpc_code}" in
            401|403|404) ;;
            *)
              echo "Expected unauthenticated MES RPC call to be denied, got HTTP ${rpc_code}"
              exit 1
              ;;
          esac

      # 1. Сборка месячного плана Workforce
      - name: Build Workforce
        working-directory: ./workforce
        run: |
          npm install
          npm test
          npm run build

      # 2. Сборка сменно-суточного диспетчера Scheduler
      - name: Build Scheduler
        working-directory: ./scheduler
        run: |
          npm install
          npm test
          npm run build

      # 3. Сборка самостоятельного MES против production Supabase
      - name: Build MES
        working-directory: ./mes
        env:
          VITE_SUPABASE_URL: ${{ env.MES_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.MES_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm install
          npm test
          npm run build

      # 4. Формирование единого сайта для публикации
      - name: Prepare site directory
        run: |
          mkdir -p _site
          find . -maxdepth 1 -not -name '.' -not -name '_site' -not -name '.git' -exec cp -r {} _site/ \;
          rm -rf _site/workforce _site/scheduler _site/mes
          cp -r workforce/dist _site/workforce
          cp -r scheduler/dist _site/scheduler
          cp -r mes/dist _site/mes

      # 5. Публикация
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
