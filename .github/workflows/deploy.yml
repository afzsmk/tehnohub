name: Deploy Tehnohub to GitHub Pages

on:
  push:
    branches: ['main']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MES_SUPABASE_URL: https://caeqoipshdtxezcurnkn.supabase.co
  MES_SUPABASE_PUBLISHABLE_KEY: sb_publishable_-WF6AF_CkK4BWX8mUERwLg_2GsfX703

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.117.0

      - name: Start local Supabase
        working-directory: ./mes
        run: supabase start

      - name: Reset local database from migrations
        working-directory: ./mes
        shell: bash
        run: |
          set -euo pipefail

          reset_log=$(mktemp)
          trap 'rm -f "${reset_log}"' EXIT

          set +e
          supabase db reset --local --no-seed 2>&1 | tee "${reset_log}"
          reset_status=${PIPESTATUS[0]}
          set -e

          if [[ "${reset_status}" -eq 0 ]]; then
            exit 0
          fi

          echo "supabase db reset failed with exit ${reset_status}."

          # Recovery is allowed only for the known post-reset gateway failure.
          if ! grep -Eq 'Error status 502|502|invalid response.*upstream|upstream server' "${reset_log}"; then
            echo "Reset failure does not match the known Kong 502 condition; refusing recovery."
            exit "${reset_status}"
          fi

          echo "Detected the known post-reset 502/upstream condition. Attempting Kong recovery."
          kong_container=$(docker ps --filter 'name=supabase_kong_' --format '{{.ID}}' | head -n 1)
          if [[ -z "${kong_container}" ]]; then
            echo "No local Supabase Kong container found."
            exit "${reset_status}"
          fi

          docker restart "${kong_container}"

          health_code=000
          for attempt in 1 2 3 4 5 6 7 8; do
            health_code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:54321/auth/v1/health || true)
            if [[ "${health_code}" == "200" ]]; then
              echo "Local Supabase Auth gateway recovered after Kong restart."
              break
            fi
            echo "Auth gateway probe attempt ${attempt}: HTTP ${health_code}"
            sleep 2
          done

          if [[ "${health_code}" != "200" ]]; then
            echo "Kong recovery did not restore the local Supabase Auth gateway."
            docker logs --tail 80 "${kong_container}" || true
            exit "${reset_status}"
          fi

          echo "Re-running the full database reset after Kong recovery."
          supabase db reset --local --no-seed

      - name: Run database security regression tests
        working-directory: ./mes
        run: supabase test db --local

      - name: Lint database schema
        working-directory: ./mes
        shell: bash
        run: |
          set -euo pipefail

          lint_output=$(mktemp)
          trap 'rm -f "${lint_output}"' EXIT

          set +e
          supabase db lint --local --level error 2>&1 | tee "${lint_output}"
          lint_status=${PIPESTATUS[0]}
          set -e

          if [[ "${lint_status}" -ne 0 ]]; then
            echo "Database lint command failed with exit ${lint_status}."
            exit "${lint_status}"
          fi

          # Supabase lint currently reports one known static-analysis false positive:
          # mes_apply_replan creates a transaction-local temp table named
          # mes_replan_changes, which the lint parser cannot resolve. All other
          # error-level diagnostics remain release-blocking.
          lint_errors=$(jq -c '
            [ .[]
              | {function, issues: [.issues[] | select(.level == "error")]}
              | select(.issues | length > 0)
              | select(
                  .function != "public.mes_apply_replan"
                  or any(.issues[]; .message != "relation \"mes_replan_changes\" does not exist")
                )
            ]' "${lint_output}")

          if [[ "${lint_errors}" != "[]" ]]; then
            echo "Unexpected database lint errors detected:"
            echo "${lint_errors}"
            exit 1
          fi

          if grep -q '"function": "public.mes_apply_replan"' "${lint_output}"; then
            echo "Accepted known lint diagnostic for transaction-local mes_replan_changes temp table."
          fi

      - name: Stop local Supabase
        if: always()
        working-directory: ./mes
        run: supabase stop

      - name: Smoke-check production Supabase API
        shell: bash
        run: |
          set -euo pipefail

          api_key="${MES_SUPABASE_PUBLISHABLE_KEY}"
          base_url="${MES_SUPABASE_URL}"
          transient_codes='^(502|503|504|000)$'

          auth_code=000
          for attempt in 1 2 3 4 5; do
            auth_code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 5 --max-time 20 \
              -H "apikey: ${api_key}" \
              "${base_url}/auth/v1/settings" || true)

            if [[ "${auth_code}" == "200" ]]; then
              echo "Production Supabase Auth API probe passed on attempt ${attempt}."
              break
            fi

            if [[ "${auth_code}" =~ ${transient_codes} && "${attempt}" -lt 5 ]]; then
              echo "Production Auth probe attempt ${attempt}: transient HTTP ${auth_code}; retrying."
              sleep $((attempt * 3))
              continue
            fi

            echo "Production Supabase Auth API probe failed: HTTP ${auth_code}"
            exit 1
          done

          if [[ "${auth_code}" != "200" ]]; then
            echo "Production Supabase Auth API did not recover after retries."
            exit 1
          fi

          rpc_body=$(mktemp)
          trap 'rm -f "${rpc_body}"' EXIT

          rpc_code=000
          for attempt in 1 2 3 4 5; do
            : > "${rpc_body}"
            rpc_code=$(curl --silent --show-error --output "${rpc_body}" --write-out '%{http_code}' \
              --connect-timeout 5 --max-time 20 \
              -X POST \
              -H "apikey: ${api_key}" \
              -H "Content-Type: application/json" \
              --data '{}' \
              "${base_url}/rest/v1/rpc/mes_get_runtime_snapshot" || true)

            if [[ "${rpc_code}" -ge 400 && "${rpc_code}" -lt 500 ]]; then
              echo "Production MES RPC denial check passed: HTTP ${rpc_code}."
              break
            fi

            if [[ "${rpc_code}" =~ ${transient_codes} && "${attempt}" -lt 5 ]]; then
              echo "Production MES RPC probe attempt ${attempt}: transient HTTP ${rpc_code}; retrying."
              sleep $((attempt * 3))
              continue
            fi

            echo "Expected unauthenticated MES RPC call to be denied, got HTTP ${rpc_code}"
            echo "Response body:"
            cat "${rpc_body}"
            exit 1
          done

          if [[ "${rpc_code}" -lt 400 || "${rpc_code}" -ge 500 ]]; then
            echo "Production MES RPC denial check did not reach an expected 4xx response."
            exit 1
          fi

      - name: Build Workforce
        working-directory: ./workforce
        run: |
          npm install
          npm test
          npm run build

      - name: Build Scheduler
        working-directory: ./scheduler
        run: |
          npm install
          npm test
          npm run build

      - name: Build MES
        working-directory: ./mes
        env:
          VITE_SUPABASE_URL: ${{ env.MES_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.MES_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm install
          npm test
          npm run build

      - name: Prepare site directory
        run: |
          mkdir -p _site
          find . -maxdepth 1 -not -name '.' -not -name '_site' -not -name '.git' -exec cp -r {} _site/ \;
          rm -rf _site/workforce _site/scheduler _site/mes
          cp -r workforce/dist _site/workforce
          cp -r scheduler/dist _site/scheduler
          cp -r mes/dist _site/mes

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
