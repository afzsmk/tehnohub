name: Deploy Tehnohub to GitHub Pages

on:
  push:
    branches: ['main']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # 1. Сборка месячного плана Workforce
      - name: Build Workforce
        working-directory: ./workforce
        run: |
          npm install
          npm test
          npm run build

      # 2. Сборка сменно-суточного диспетчера Scheduler
      - name: Build Scheduler
        working-directory: ./scheduler
        run: |
          npm install
          npm test
          npm run build

      # 3. Сборка самостоятельного MES
      - name: Build MES
        working-directory: ./mes
        run: |
          npm install
          npm test
          npm run build

      # 4. Формирование единого сайта для публикации
      - name: Prepare site directory
        run: |
          mkdir -p _site
          find . -maxdepth 1 -not -name '.' -not -name '_site' -not -name '.git' -exec cp -r {} _site/ \;
          rm -rf _site/workforce _site/scheduler _site/mes
          cp -r workforce/dist _site/workforce
          cp -r scheduler/dist _site/scheduler
          cp -r mes/dist _site/mes

      # 5. Публикация
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
