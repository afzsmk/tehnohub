name: BriketMaster Hardening
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch calculator hardening
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('BriketMaster.html'); s=p.read_text(encoding='utf-8')
          reps={
          "const fotNdfl = parseFloat(document.getElementById('fot_ndfl').value) || 0;":"const fotNdfl = Math.min(99, Math.max(0, parseFloat(document.getElementById('fot_ndfl').value) || 0));\n                if (document.getElementById('fot_ndfl').value !== String(fotNdfl)) document.getElementById('fot_ndfl').value = fotNdfl;",
          "const fotInsurance = parseFloat(document.getElementById('fot_insurance').value) || 0;":"const fotInsurance = Math.max(0, parseFloat(document.getElementById('fot_insurance').value) || 0);\n                if (document.getElementById('fot_insurance').value !== String(fotInsurance)) document.getElementById('fot_insurance').value = fotInsurance;",
          "const fotHours = parseFloat(document.getElementById('fot_hours').value) || 1;":"const fotHours = Math.max(1, parseFloat(document.getElementById('fot_hours').value) || 1);\n                if (document.getElementById('fot_hours').value !== String(fotHours)) document.getElementById('fot_hours').value = fotHours;",
          "const fotCrew = parseFloat(document.getElementById('fot_crew').value) || 0;":"const fotCrew = Math.max(0, parseFloat(document.getElementById('fot_crew').value) || 0);\n                if (document.getElementById('fot_crew').value !== String(fotCrew)) document.getElementById('fot_crew').value = fotCrew;",
          "const p_foil = parseFloat(document.getElementById('p_foil').value) || 0;":"const p_foil = Math.max(0, parseFloat(document.getElementById('p_foil').value) || 0);",
          "const p_scrap = parseFloat(document.getElementById('p_scrap').value) || 0;":"const p_scrap = Math.max(0, parseFloat(document.getElementById('p_scrap').value) || 0);",
          "const p_glue = parseFloat(document.getElementById('p_glue').value) || 0;":"const p_glue = Math.max(0, parseFloat(document.getElementById('p_glue').value) || 0);",
          "const p_solv = parseFloat(document.getElementById('p_solv').value) || 0;":"const p_solv = Math.max(0, parseFloat(document.getElementById('p_solv').value) || 0);",
          "const p_aux = parseFloat(document.getElementById('p_aux').value) || 0;":"const p_aux = Math.max(0, parseFloat(document.getElementById('p_aux').value) || 0);",
          "const compWidth = parseFloat(document.getElementById('comp_width').value) || 0;":"const compWidth = Math.max(0, parseFloat(document.getElementById('comp_width').value) || 0);",
          "const compPrice = parseFloat(document.getElementById('comp_price').value) || 0;":"const compPrice = Math.max(0, parseFloat(document.getElementById('comp_price').value) || 0);",
          "document.getElementById('marketPriceInput').value = Math.round(marketPriceComparable);":"if (document.activeElement !== document.getElementById('marketPriceInput')) {\n                    document.getElementById('marketPriceInput').value = Math.round(marketPriceComparable);\n                }",
          }
          for a,b in reps.items():
              if a not in s: raise SystemExit('missing pattern: '+a)
              s=s.replace(a,b,1)
          # Guard the main calculation snapshot against non-finite arithmetic.
          marker="window.currentCalculation = {"
          if marker not in s: raise SystemExit('missing currentCalculation marker')
          p.write_text(s,encoding='utf-8')
          print('patched',len(s))
          PY
          node - <<'JS'
          const fs=require('fs'); const s=fs.readFileSync('BriketMaster.html','utf8'); const scripts=[...s.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).join('\n'); fs.writeFileSync('/tmp/app.js',scripts);
          JS
          node --check /tmp/app.js
          git diff --check
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BriketMaster.html
          git commit -m 'fix: harden BriketMaster numeric inputs' && git push
      - name: Cleanup
        if: always()
        run: |
          rm -f .github/workflows/briketmaster-hardening.yml
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/briketmaster-hardening.yml
          git commit -m 'chore: remove BriketMaster hardening workflow' || true
          git push || true
