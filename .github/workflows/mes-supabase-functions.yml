name: MES Supabase Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mes/supabase/functions/workforce-import/**'
      - 'mes/supabase/config.toml'
      - '.github/workflows/mes-supabase-functions.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: caeqoipshdtxezcurnkn
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.117.0

      - name: Deploy workforce-import
        working-directory: ./mes
        run: |
          set -euo pipefail
          supabase functions deploy workforce-import --project-ref "${SUPABASE_PROJECT_REF}"

      - name: Verify deployed function
        working-directory: ./mes
        run: |
          set -euo pipefail
          functions=$(supabase functions list --project-ref "${SUPABASE_PROJECT_REF}")
          echo "${functions}"
          echo "${functions}" | grep -E 'workforce-import|ACTIVE' >/dev/null
