name: MES Supabase Functions

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: caeqoipshdtxezcurnkn

jobs:
  deploy:
    name: Deploy MES Workforce ingress function
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.117.0

      - name: Deploy workforce-import
        working-directory: ./mes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions deploy workforce-import --project-ref "${SUPABASE_PROJECT_REF}"

      - name: Verify deployed function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          functions=$(supabase functions list --project-ref "${SUPABASE_PROJECT_REF}")
          echo "${functions}"
          echo "${functions}" | grep -E 'workforce-import|ACTIVE' >/dev/null

      - name: CI permission note
        if: ${{ failure() }}
        run: |
          echo "A Supabase HTTP 403 means the Actions PAT needs Edge Functions: Read-write permission on project ${SUPABASE_PROJECT_REF}."
